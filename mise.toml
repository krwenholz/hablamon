# Toolchain and task runner. `mise install` fetches Swift; `mise tasks` lists tasks.
# On macOS, mise installs the swift.org toolchain (separate from Xcode's); the
# macOS SDK still comes from Xcode or the Command Line Tools.
[tools]
swift = "6.4"

[tasks.build]
description = "Debug build"
run = "swift build"

[tasks.test]
description = "Run all Swift Testing suites"
run = "swift test --disable-xctest --no-parallel"

[tasks.lint]
description = "Check formatting with swift-format"
run = "swift format lint --recursive --strict Package.swift Sources Tests Apps"

[tasks.format]
description = "Format sources in place with swift-format"
run = "swift format --in-place --recursive Package.swift Sources Tests Apps"

[tasks.schemas]
description = "Regenerate schemas/*.schema.json from the model types"
run = "swift run hablamon schema export"

[tasks.fixtures]
description = "Download fixture videos that live outside git"
run = "scripts/fetch-fixtures.sh"

[tasks.verify]
description = "Lint, build, and test; writes reports/verify.md"
run = "scripts/verify.sh"

[tasks.metallib]
description = "Build MLX's Metal shaders for the voices (after a debug build; install does this itself)"
run = "scripts/build-metallib.sh debug"

[tasks.install]
description = "Build Hablamon.app (release), install to ~/Applications, link the CLI"
run = "scripts/install.sh"

[tasks.update]
description = "Pull the latest main, reinstall Hablamon.app, and relaunch it"
run = "scripts/update.sh"

[tasks.phone]
description = "Build the iPhone app and install it on the connected iPhone (see docs/plans/ios-app.md)"
run = "scripts/phone.sh"
