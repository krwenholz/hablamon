name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise run verify
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: verify-report
          path: reports/
