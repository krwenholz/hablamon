<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- macOS icon grid: 824×824 body with a 100 px margin. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3678"/>
      <stop offset="1" stop-color="#121836"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a3d"/>
      <stop offset="1" stop-color="#e5402a"/>
    </linearGradient>
    <pattern id="stripes" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="28" height="56" fill="#ffffff" opacity="0.05"/>
    </pattern>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
    <clipPath id="ball"><circle cx="512" cy="512" r="300"/></clipPath>
  </defs>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#stripes)"/>
  </g>
  <!-- Hard offset shadow, like the window's ink cards. -->
  <circle cx="530" cy="530" r="318" fill="#0b0f24"/>
  <g clip-path="url(#ball)">
    <rect x="200" y="200" width="624" height="312" fill="url(#top)"/>
    <rect x="200" y="512" width="624" height="312" fill="#fbfaf3"/>
    <rect x="200" y="486" width="624" height="52" fill="#1d1d24"/>
  </g>
  <circle cx="512" cy="512" r="300" fill="none" stroke="#1d1d24" stroke-width="36"/>
  <circle cx="512" cy="512" r="112" fill="#1d1d24"/>
  <circle cx="512" cy="512" r="82" fill="#fbfaf3"/>
  <!-- The H, in the dialogue box's navy, with the game's yellow tick. -->
  <g fill="#1b2453">
    <rect x="471" y="468" width="22" height="88" rx="4"/>
    <rect x="531" y="468" width="22" height="88" rx="4"/>
    <rect x="471" y="501" width="82" height="22" rx="4"/>
  </g>
  <rect x="450" y="472" width="8" height="30" rx="3" fill="#f6cf1a"/>
</svg>
